[theme]
base = "light"
# Accent: emerald-600 (deeper for contrast on a white background).
# Red is reserved for the risk strip + halt banner so the accent
# doesn't compete with the warning state.
primaryColor = "#059669"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
font = "sans serif"

[server]
headless = true
runOnSave = false
